<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新聞論述與邏輯推理訓練網 (25題完整版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header 頂部欄 -->
    <header class="bg-indigo-700 text-white shadow-lg py-8 px-4">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight mb-2">📰 新聞論述與邏輯推理訓練網</h1>
            <p class="text-indigo-200 text-sm md:text-base">掌握四種條件句型：看穿媒體包裝，精準識別邏輯謬誤與逆否命題</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">

        <!-- 1. 核心邏輯指南區塊 -->
        <section class="bg-white rounded-2xl p-6 md:p-8 card-shadow border border-slate-100">
            <h2 class="text-2xl font-bold text-slate-900 border-l-4 border-indigo-600 pl-3 mb-4">
                🧠 核心邏輯與四句型對照指南
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mt-6">
                <div class="p-4 rounded-xl border border-indigo-100 bg-indigo-50/50">
                    <span class="px-2 py-0.5 text-xs font-bold bg-indigo-200 text-indigo-800 rounded">原命題</span>
                    <p class="text-base font-mono font-bold text-indigo-700 my-1">P → Q</p>
                    <p class="text-xs text-slate-600">若 A 則 B（基礎假設）</p>
                </div>
                <div class="p-4 rounded-xl border border-emerald-200 bg-emerald-50/60">
                    <span class="px-2 py-0.5 text-xs font-bold bg-emerald-200 text-emerald-900 rounded">逆否命題</span>
                    <p class="text-base font-mono font-bold text-emerald-700 my-1">¬Q → ¬P</p>
                    <p class="text-xs text-slate-600">若非 B 則非 A<br><strong class="text-emerald-700">✅ 與原命題 100% 等價</strong></p>
                </div>
                <div class="p-4 rounded-xl border border-amber-200 bg-amber-50/60">
                    <span class="px-2 py-0.5 text-xs font-bold bg-amber-200 text-amber-900 rounded">逆命題</span>
                    <p class="text-base font-mono font-bold text-amber-700 my-1">Q → P</p>
                    <p class="text-xs text-slate-600">若 B 則 A<br><strong class="text-amber-700">❌ 犯了「肯定後件謬誤」</strong></p>
                </div>
                <div class="p-4 rounded-xl border border-rose-200 bg-rose-50/60">
                    <span class="px-2 py-0.5 text-xs font-bold bg-rose-200 text-rose-900 rounded">否命題</span>
                    <p class="text-base font-mono font-bold text-rose-700 my-1">¬P → ¬Q</p>
                    <p class="text-xs text-slate-600">若非 A 則非 B<br><strong class="text-rose-700">❌ 犯了「否定前件謬誤」</strong></p>
                </div>
            </div>
        </section>

        <!-- 模式切換 Tabs -->
        <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-2">
            <button id="tab-quiz" onclick="switchMode('quiz')" class="py-3 px-6 text-slate-600 font-medium tab-active transition">
                <i class="fa-solid fa-gamepad mr-2"></i>🎯 互動測驗模式 (25題)
            </button>
            <button id="tab-study" onclick="switchMode('study')" class="py-3 px-6 text-slate-600 font-medium transition">
                <i class="fa-solid fa-book-open mr-2"></i>📖 全覽學習模式 (卡片與搜尋)
            </button>
        </div>

        <!-- 2. 互動測驗模式容器 -->
        <section id="view-quiz" class="bg-white rounded-b-2xl p-6 md:p-8 card-shadow border border-slate-100">
            <div id="quiz-header" class="flex flex-col sm:flex-row justify-between items-center pb-6 border-b border-slate-100 gap-4">
                <div>
                    <span id="quiz-progress-text" class="text-xs font-bold text-indigo-600 bg
